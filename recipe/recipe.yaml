schema_version: 1

context:
  version: "0.2.7"
  spiffe_tls_version: "0.3.0"

recipe:
  name: spiffe-packages
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/s/spiffe/spiffe-${{ version }}.tar.gz
    sha256: 840511865158a8910d76b1388c4275e020baca3961a654aeffa29082ed9b9080
    target_directory: spiffe
  - url: https://pypi.org/packages/source/s/spiffe-tls/spiffe_tls-${{ spiffe_tls_version }}.tar.gz
    sha256: ae22d6b65066f5f3652e963e57957639667c3b3e26386c63285cd1672206c3b7
    target_directory: spiffe-tls

build:
  number: 1
  noarch: python

outputs:
  - package:
      name: spiffe
      version: ${{ version }}
    build:
      noarch: python
      script:
        - cd spiffe
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - python >=${{ python_min }}
        - pip
        - poetry-core >=1.9.0
      run:
        - python >=${{ python_min }}
        - grpcio >=1.62
        - cryptography >=42
        - pyjwt >=2
        - pyasn1
        - pyasn1-modules
        - protobuf
        - pem >=23
    tests:
      - python:
          imports:
            - spiffe

  - package:
      name: spiffe-tls
      version: ${{ spiffe_tls_version }}
    build:
      noarch: python
      script:
        - cd spiffe-tls
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - python >=${{ python_min }}
        - pip
        - poetry-core >=1.9.0
      run:
        - python >=${{ python_min }}
        - pyopenssl >=24
        - spiffe
      run_constraints:
        - spiffe ==${{ version }}
    tests:
      - python:
          imports:
            - spiffetls

about:
  homepage: https://github.com/HewlettPackard/py-spiffe
  repository: https://github.com/HewlettPackard/py-spiffe
  license: Apache-2.0
  license_file: spiffe/LICENSE
  summary: Python library for SPIFFE support

extra:
  recipe-maintainers:
    - JohanMabille
    - martinRenou
